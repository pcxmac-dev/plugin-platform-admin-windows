[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-admin-windows"
version = "0.2.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Windows administration for Liminal: the platform's rights, the Windows services the framework relies on, the apps' scheduled tasks at logon, the platform's at boot, the framework's processes."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.1; the boot services: 1.47.0)
dependencies = ["liminal-libs>=1.47.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
admin-windows = "plugin_platform_admin_windows"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
